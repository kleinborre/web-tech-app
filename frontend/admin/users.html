<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ImageToTextOnline Admin - User Management. View, search, and manage all users.">
    <title>User Management - ImageToTextOnline</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .users-search {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            max-width: 400px;
        }

        .users-search input {
            flex: 1;
        }

        .user-detail-modal .modal-body {
            padding: 0;
        }

        .user-detail {
            padding: 1.5rem;
        }

        .user-detail__item {
            display: flex;
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0.75rem 0;
        }

        .user-detail__item:last-child {
            border-bottom: none;
        }

        .user-detail__label {
            font-weight: 600;
            color: var(--color-gray-600);
            width: 140px;
            flex-shrink: 0;
        }

        .user-detail__value {
            flex: 1;
        }

        .user-detail__actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--color-gray-200);
        }
    </style>
</head>

<body>
    <!-- ========================================================================
         DASHBOARD LAYOUT
         ======================================================================== -->
    <div class="dashboard">
        <!-- Dashboard Header -->
        <header class="dashboard__header" style="position: relative;">
            <a href="/home" class="dashboard__logo">
                <i class="bi bi-file-text"></i>
                ImageToTextOnline
            </a>

            <!-- Hamburger Toggle (visible <992px) -->
            <button class="dashboard__hamburger" id="hamburgerToggle" aria-label="Toggle menu">
                <span class="dashboard__hamburger-line"></span>
                <span class="dashboard__hamburger-line"></span>
                <span class="dashboard__hamburger-line"></span>
            </button>

            <div class="dashboard__user">
                <a href="/settings" class="dashboard__user-link" title="Account Settings"
                    style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: inherit; transition: opacity 0.2s;">
                    <span id="welcomeUser"
                        style="color: var(--color-gray-600); font-size: var(--font-size-sm);">Welcome,
                        Admin</span>
                    <div id="userAvatar" class="dashboard__avatar">A</div>
                </a>
                <div id="notif-container-users" style="display: inline-flex; align-items: center;"></div>
                <a href="#" id="logoutBtn" class="btn btn--outline btn--sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Sign Out
                </a>
            </div>

            <!-- Mobile Dropdown Menu -->
            <div class="dashboard__mobile-menu" id="mobileMenu">
                <nav class="dashboard__mobile-nav">
                    <div class="dashboard__mobile-links">
                        <a href="/dashboard" class="dashboard__mobile-link">
                            <i class="bi bi-grid me-1"></i> Dashboard
                        </a>
                        <a href="/home" class="dashboard__mobile-link">
                            <i class="bi bi-file-text me-1"></i> Convert
                        </a>
                        <a href="#" class="dashboard__mobile-link dashboard__mobile-link--active">
                            <i class="bi bi-people me-1"></i> Users
                        </a>
                        <a href="/settings" class="dashboard__mobile-link">
                            <i class="bi bi-gear me-1"></i> Settings
                        </a>
                        <a href="#" class="dashboard__mobile-link" id="mobileLogoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                        </a>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Dashboard Body -->
        <div class="dashboard__body">
            <!-- Sidebar Navigation -->
            <aside class="dashboard__sidebar">
                <nav>
                    <ul class="dashboard__nav">
                        <li class="dashboard__nav-item">
                            <a href="/dashboard" class="dashboard__nav-link">
                                <i class="bi bi-grid"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="dashboard__nav-item">
                            <a href="/home" class="dashboard__nav-link">
                                <i class="bi bi-file-text"></i>
                                Convert
                            </a>
                        </li>
                        <li class="dashboard__nav-item">
                            <a href="#" class="dashboard__nav-link dashboard__nav-link--active">
                                <i class="bi bi-people"></i>
                                Users
                            </a>
                        </li>
                        <li class="dashboard__nav-item">
                            <a href="/settings" class="dashboard__nav-link">
                                <i class="bi bi-gear"></i>
                                Settings
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="dashboard__content">
                <!-- Page Title -->
                <div class="users-header">
                    <h1 style="font-size: var(--font-size-2xl); margin-bottom: 0;">User Management</h1>
                    <div class="users-search">
                        <input type="text" id="searchInput" class="form-control"
                            placeholder="Search by username, email, role, status...">
                        <button class="btn btn--secondary" id="refreshBtn" title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="dashboard__card">
                    <div class="admin-users-table-wrapper">
                        <div style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Joined</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-4">
                                            <div class="spinner-border spinner-border-sm" role="status"></div>
                                            Loading users...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="admin-users-cards-wrapper">
                        <div id="usersCardsContainer" class="history-cards"></div>
                    </div>
                    <div id="usersPagination" class="mt-3 d-flex justify-content-center"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- User Detail Modal -->
    <div class="modal fade" id="userDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-white"
                    style="background: linear-gradient(135deg, #00838f, #00acc1); align-items: flex-start;">
                    <h5 class="modal-title"
                        style="font-size: 1rem; word-break: break-word; white-space: normal; overflow-wrap: anywhere; max-width: calc(100% - 40px);">
                        <i class="bi bi-person-circle me-2"></i>User Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        style="filter: invert(1); opacity: 0.9; flex-shrink: 0;"></button>
                </div>
                <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                    <div class="user-detail" id="userDetailContent">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sound Manager -->
    <script src="../js/sound-manager.js"></script>

    <!-- Loading Overlay -->
    <script src="../js/loading-overlay.js"></script>

    <!-- Auth JavaScript -->
    <script src="../js/auth.js"></script>

    <!-- Users Page Script -->
    <script>
        const UsersPageConfig = {
            ADMIN_API: '/api/admin',
            AUTH_API: '/api/auth',
            ITEMS_PER_PAGE: 20,
            LOGIN_PAGE: '/auth/login'
        };

        const UsersPageState = {
            currentUser: null,
            users: [],
            filteredUsers: [],
            page: 1,
            totalPages: 1,
            searchQuery: '',
            cardPage: 1,
            CARDS_PER_PAGE: 3
        };

        // API calls
        const UsersAPI = {
            async getMe() {
                const res = await fetch(`${UsersPageConfig.AUTH_API}/me`, { credentials: 'include' });
                return res.json();
            },
            async getUsers(page = 1) {
                const res = await fetch(`${UsersPageConfig.ADMIN_API}/users?page=${page}&limit=${UsersPageConfig.ITEMS_PER_PAGE}`, { credentials: 'include' });
                return res.json();
            },
            async getUser(id) {
                const res = await fetch(`${UsersPageConfig.ADMIN_API}/users/${id}`, { credentials: 'include' });
                return res.json();
            },
            async toggleStatus(id) {
                const res = await fetch(`${UsersPageConfig.ADMIN_API}/users/${id}/status`, { method: 'PATCH', credentials: 'include' });
                return res.json();
            },
            async changeRole(id, role) {
                const res = await fetch(`${UsersPageConfig.ADMIN_API}/users/${id}/role`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ role })
                });
                return res.json();
            }
        };

        // Utilities
        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getInitials(name) {
            return name ? name.substring(0, 2).toUpperCase() : 'U';
        }

        function getRoleBadge(role) {
            const classes = { superadmin: 'bg-danger', admin: 'bg-primary', user: 'bg-secondary' };
            return `<span class="badge ${classes[role] || 'bg-secondary'}">${role}</span>`;
        }

        function showToast(message, type = 'info') {
            if (typeof DashboardUI !== 'undefined') {
                DashboardUI.showToast(message, type);
            } else if (typeof UI !== 'undefined') {
                UI.showToast(message, type);
            } else {
                alert(message);
            }
        }

        // Render users table
        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            const cardsContainer = document.getElementById('usersCardsContainer');
            const users = UsersPageState.filteredUsers.length > 0 || UsersPageState.searchQuery
                ? UsersPageState.filteredUsers
                : UsersPageState.users;

            if (users.length === 0) {
                if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No users found</td></tr>`;
                if (cardsContainer) cardsContainer.innerHTML = `<div class="text-center py-4 text-muted"><i class="bi bi-inbox" style="font-size: 2rem;"></i><p>No users found</p></div>`;
                return;
            }

            // === Table rendering (desktop) ===
            if (tbody) {
                tbody.innerHTML = users.map(user => {
                    const isSelf = user._id === UsersPageState.currentUser?._id;
                    const isSuperadmin = user.role === 'superadmin';
                    const canModify = !isSelf && !isSuperadmin;

                    return `
                        <tr data-id="${user._id}" style="cursor: pointer;" onclick="viewUser('${user._id}')">
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <div class="dashboard__avatar" style="width: 32px; height: 32px; font-size: 0.875rem; overflow: hidden;">${user.profilePicture ? `<img src="${user.profilePicture}" alt="${user.username}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : getInitials(user.username)}</div>
                                    <span>${user.username}${isSelf ? ' (You)' : ''}</span>
                                </div>
                            </td>
                            <td>${user.email || '-'}</td>
                            <td>${getRoleBadge(user.role)}</td>
                            <td>${formatDate(user.createdAt)}</td>
                            <td><span class="badge ${user.isActive ? 'bg-success' : 'bg-danger'}">${user.isActive ? 'Active' : 'Inactive'}</span></td>
                            <td onclick="event.stopPropagation();">
                                ${canModify ? `
                                    <button class="btn btn--secondary btn--sm" onclick="toggleStatus('${user._id}')" title="${user.isActive ? 'Deactivate' : 'Activate'}">
                                        <i class="bi bi-${user.isActive ? 'person-x' : 'person-check'}"></i> ${user.isActive ? 'Deactivate' : 'Activate'}
                                    </button>
                                    ${UsersPageState.currentUser?.role === 'superadmin' ? `
                                        <button class="btn btn--secondary btn--sm" onclick="toggleRole('${user._id}', '${user.role}')" title="${user.role === 'admin' ? 'Demote' : 'Promote'}">
                                            <i class="bi bi-${user.role === 'admin' ? 'arrow-down' : 'arrow-up'}"></i> ${user.role === 'admin' ? 'Demote' : 'Promote'}
                                        </button>
                                    ` : ''}
                                ` : '<span class="text-muted">-</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // === Card rendering (mobile) with pagination ===
            if (cardsContainer) {
                const perPage = UsersPageState.CARDS_PER_PAGE;
                const totalCardPages = Math.ceil(users.length / perPage);
                if (UsersPageState.cardPage > totalCardPages) UsersPageState.cardPage = totalCardPages;
                if (UsersPageState.cardPage < 1) UsersPageState.cardPage = 1;
                const start = (UsersPageState.cardPage - 1) * perPage;
                const pageUsers = users.slice(start, start + perPage);

                let html = pageUsers.map(user => {
                    const isSelf = user._id === UsersPageState.currentUser?._id;
                    const isSuperadmin = user.role === 'superadmin';
                    const canModify = !isSelf && !isSuperadmin;

                    return `
                        <div class="user-card" onclick="viewUser('${user._id}')">
                            <div class="user-card__header">
                                <div class="dashboard__avatar" style="width: 36px; height: 36px; font-size: 0.875rem; overflow: hidden;">${user.profilePicture ? `<img src="${user.profilePicture}" alt="${user.username}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : getInitials(user.username)}</div>
                                <div class="user-card__info">
                                    <div class="user-card__name">${user.username}${isSelf ? ' (You)' : ''}</div>
                                    <div class="user-card__email">${user.email || '-'}</div>
                                </div>
                            </div>
                            <div class="user-card__meta">
                                ${getRoleBadge(user.role)}
                                <span class="badge ${user.isActive ? 'bg-success' : 'bg-danger'}">${user.isActive ? 'Active' : 'Inactive'}</span>
                                <span style="font-size: 0.75rem; color: var(--color-gray-500);">${formatDate(user.createdAt)}</span>
                            </div>
                            ${canModify ? `
                                <div class="user-card__actions" onclick="event.stopPropagation();">
                                    <button class="btn btn--secondary btn--sm" onclick="toggleStatus('${user._id}')" title="${user.isActive ? 'Deactivate' : 'Activate'}">
                                        <i class="bi bi-${user.isActive ? 'person-x' : 'person-check'}"></i>
                                    </button>
                                    ${UsersPageState.currentUser?.role === 'superadmin' ? `
                                        <button class="btn btn--secondary btn--sm" onclick="toggleRole('${user._id}', '${user.role}')" title="${user.role === 'admin' ? 'Demote' : 'Promote'}">
                                            <i class="bi bi-${user.role === 'admin' ? 'arrow-down' : 'arrow-up'}"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                // Card pagination controls
                if (totalCardPages > 1) {
                    html += `<div class="history-card-pagination">`;
                    html += `<button class="btn btn--secondary btn--sm" ${UsersPageState.cardPage === 1 ? 'disabled' : ''} onclick="goCardPage(${UsersPageState.cardPage - 1})"><i class="bi bi-chevron-left"></i></button>`;
                    for (let i = 1; i <= totalCardPages; i++) {
                        html += `<button class="btn btn--sm ${i === UsersPageState.cardPage ? 'btn--primary' : 'btn--secondary'}" onclick="goCardPage(${i})">${i}</button>`;
                    }
                    html += `<button class="btn btn--secondary btn--sm" ${UsersPageState.cardPage === totalCardPages ? 'disabled' : ''} onclick="goCardPage(${UsersPageState.cardPage + 1})"><i class="bi bi-chevron-right"></i></button>`;
                    html += `</div>`;
                }

                cardsContainer.innerHTML = html;
            }
        }

        // Render pagination
        function renderPagination() {
            const container = document.getElementById('usersPagination');
            const { page, totalPages } = UsersPageState;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '<nav><ul class="pagination pagination-sm mb-0">';
            html += `<li class="page-item ${page === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadUsers(${page - 1}); return false;">Prev</a></li>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= page - 1 && i <= page + 1)) {
                    html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadUsers(${i}); return false;">${i}</a></li>`;
                } else if (i === page - 2 || i === page + 2) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }

            html += `<li class="page-item ${page === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadUsers(${page + 1}); return false;">Next</a></li>`;
            html += '</ul></nav>';
            container.innerHTML = html;
        }

        // Load users
        async function loadUsers(page = 1) {
            try {
                const result = await UsersAPI.getUsers(page);
                if (result.success) {
                    UsersPageState.users = result.data;
                    UsersPageState.page = result.pagination.page;
                    UsersPageState.totalPages = result.pagination.pages;

                    // Apply search filter
                    if (UsersPageState.searchQuery) {
                        filterUsers(UsersPageState.searchQuery);
                    } else {
                        UsersPageState.filteredUsers = [];
                        renderUsers();
                    }
                    UsersPageState.cardPage = 1;
                    renderPagination();
                }
            } catch (error) {
                console.error('Load users error:', error);
                showToast('Failed to load users', 'danger');
            }
        }

        // Card page navigation
        function goCardPage(page) {
            UsersPageState.cardPage = page;
            renderUsers();
        }

        // Filter users
        function filterUsers(query) {
            UsersPageState.searchQuery = query.toLowerCase();
            UsersPageState.cardPage = 1;
            if (!query) {
                UsersPageState.filteredUsers = [];
            } else {
                UsersPageState.filteredUsers = UsersPageState.users.filter(user =>
                    user.username.toLowerCase().includes(query) ||
                    (user.email && user.email.toLowerCase().includes(query)) ||
                    user.role.toLowerCase().includes(query) ||
                    (user.isActive ? 'active' : 'inactive').includes(query)
                );
            }
            renderUsers();
        }

        // View user details
        async function viewUser(userId) {
            try {
                const result = await UsersAPI.getUser(userId);
                if (result.success) {
                    const user = result.data;
                    const isSelf = user._id === UsersPageState.currentUser?._id;
                    const isSuperadmin = user.role === 'superadmin';
                    const canModify = !isSelf && !isSuperadmin;

                    document.getElementById('userDetailContent').innerHTML = `
                        <div style="text-align: center; margin-bottom: 1rem;">
                            <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #00838f, #00acc1); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 600; margin: 0 auto; overflow: hidden;">
                                ${user.profilePicture ? `<img src="${user.profilePicture}" alt="${user.username}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : getInitials(user.username)}
                            </div>
                            <div style="margin-top: 0.5rem; font-weight: 600; font-size: 1rem;">${user.username}</div>
                        </div>
                        <div class="user-detail__item">
                            <span class="user-detail__label">Email</span>
                            <span class="user-detail__value">${user.email || '-'}</span>
                        </div>
                        <div class="user-detail__item">
                            <span class="user-detail__label">Role</span>
                            <span class="user-detail__value">${getRoleBadge(user.role)}</span>
                        </div>
                        <div class="user-detail__item">
                            <span class="user-detail__label">Status</span>
                            <span class="user-detail__value"><span class="badge ${user.isActive ? 'bg-success' : 'bg-danger'}">${user.isActive ? 'Active' : 'Inactive'}</span></span>
                        </div>
                        <div class="user-detail__item">
                            <span class="user-detail__label">Joined</span>
                            <span class="user-detail__value">${formatDate(user.createdAt)}</span>
                        </div>
                        <div class="user-detail__item">
                            <span class="user-detail__label">Conversions</span>
                            <span class="user-detail__value">${user.conversionCount || 0}</span>
                        </div>
                        ${canModify ? `
                            <div class="user-detail__actions" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--color-gray-100);">
                                <button class="btn btn-sm ${user.isActive ? 'btn--secondary' : 'btn--primary'}" style="font-size: 0.85rem; padding: 0.4rem 1rem;" onclick="toggleStatus('${user._id}'); bootstrap.Modal.getInstance(document.getElementById('userDetailModal')).hide();">
                                    <i class="bi bi-${user.isActive ? 'person-x' : 'person-check'} me-1"></i>${user.isActive ? 'Deactivate' : 'Activate'}
                                </button>
                                ${UsersPageState.currentUser?.role === 'superadmin' ? `
                                    <button class="btn btn-sm btn--outline" style="font-size: 0.85rem; padding: 0.4rem 1rem;" onclick="toggleRole('${user._id}', '${user.role}'); bootstrap.Modal.getInstance(document.getElementById('userDetailModal')).hide();">
                                        <i class="bi bi-${user.role === 'admin' ? 'arrow-down' : 'arrow-up'} me-1"></i>${user.role === 'admin' ? 'Demote' : 'Promote'}
                                    </button>
                                ` : ''}
                            </div>
                        ` : ''}
                    `;

                    new bootstrap.Modal(document.getElementById('userDetailModal')).show();
                }
            } catch (error) {
                console.error('View user error:', error);
                showToast('Failed to load user details', 'danger');
            }
        }

        // Toggle status with double confirmation
        async function toggleStatus(userId) {
            const user = UsersPageState.users.find(u => u._id === userId);
            const action = user?.isActive ? 'deactivate' : 'reactivate';

            if (typeof UI !== 'undefined' && UI.showDoubleConfirmDialog) {
                UI.showDoubleConfirmDialog(
                    `${user?.isActive ? 'Deactivate' : 'Reactivate'} User`,
                    `${action.charAt(0).toUpperCase() + action.slice(1)} ${user?.username}?`,
                    'Final Confirmation',
                    `${user?.isActive ? 'The user will be locked out.' : 'The user will regain access.'}`,
                    async () => {
                        const result = await UsersAPI.toggleStatus(userId);
                        if (result.success) {
                            showToast(result.message, 'success');
                            loadUsers(UsersPageState.page);
                        } else {
                            showToast(result.error, 'danger');
                        }
                    },
                    user?.isActive ? 'danger' : 'primary'
                );
            } else {
                const result = await UsersAPI.toggleStatus(userId);
                if (result.success) {
                    showToast(result.message, 'success');
                    loadUsers(UsersPageState.page);
                } else {
                    showToast(result.error, 'danger');
                }
            }
        }

        // Toggle role with double confirmation
        async function toggleRole(userId, currentRole) {
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            const user = UsersPageState.users.find(u => u._id === userId);

            if (typeof UI !== 'undefined' && UI.showDoubleConfirmDialog) {
                UI.showDoubleConfirmDialog(
                    `${newRole === 'admin' ? 'Promote' : 'Demote'} User`,
                    `${newRole === 'admin' ? 'Promote' : 'Demote'} ${user?.username}?`,
                    'Final Confirmation',
                    `Are you sure you want to ${newRole === 'admin' ? 'promote' : 'demote'} this user?`,
                    async () => {
                        const result = await UsersAPI.changeRole(userId, newRole);
                        if (result.success) {
                            showToast(result.message, 'success');
                            loadUsers(UsersPageState.page);
                        } else {
                            showToast(result.error, 'danger');
                        }
                    },
                    'primary'
                );
            } else {
                const result = await UsersAPI.changeRole(userId, newRole);
                if (result.success) {
                    showToast(result.message, 'success');
                    loadUsers(UsersPageState.page);
                } else {
                    showToast(result.error, 'danger');
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Check auth
                const result = await UsersAPI.getMe();
                if (!result.success || !['admin', 'superadmin'].includes(result.user.role)) {
                    window.location.href = UsersPageConfig.LOGIN_PAGE;
                    return;
                }

                UsersPageState.currentUser = result.user;

                // Update UI
                document.getElementById('welcomeUser').textContent = `Welcome, ${result.user.username}`;
                const avatarEl = document.getElementById('userAvatar');
                if (result.user.profilePicture) {
                    avatarEl.innerHTML = `<img src="${result.user.profilePicture}" alt="Profile" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                } else {
                    avatarEl.textContent = getInitials(result.user.username);
                }

                // Load users
                loadUsers();

                // Search input
                const searchInput = document.getElementById('searchInput');
                let debounceTimer;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => filterUsers(e.target.value), 300);
                });

                // Refresh button
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    searchInput.value = '';
                    UsersPageState.searchQuery = '';
                    loadUsers(1);
                });

                // === Hamburger Toggle ===
                const hamburger = document.getElementById('hamburgerToggle');
                const mobileMenu = document.getElementById('mobileMenu');
                if (hamburger && mobileMenu) {
                    hamburger.addEventListener('click', () => {
                        hamburger.classList.toggle('dashboard__hamburger--active');
                        mobileMenu.classList.toggle('dashboard__mobile-menu--open');
                    });
                    mobileMenu.querySelectorAll('.dashboard__mobile-link').forEach(link => {
                        if (link.id !== 'mobileLogoutBtn') {
                            link.addEventListener('click', () => {
                                hamburger.classList.remove('dashboard__hamburger--active');
                                mobileMenu.classList.remove('dashboard__mobile-menu--open');
                            });
                        }
                    });
                }

                // === Nav link loading overlay ===
                document.querySelectorAll('.dashboard__nav-link:not(.dashboard__nav-link--active), .dashboard__mobile-link:not(.dashboard__mobile-link--active)').forEach(link => {
                    if (link.id === 'mobileLogoutBtn') return;
                    link.addEventListener('click', () => {
                        if (typeof LoadingOverlay !== 'undefined') {
                            LoadingOverlay.show('Loading...');
                        }
                    });
                });

                // === Mobile Sign Out ===
                const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
                if (mobileLogoutBtn) {
                    mobileLogoutBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        hamburger?.classList.remove('dashboard__hamburger--active');
                        mobileMenu?.classList.remove('dashboard__mobile-menu--open');
                        if (typeof UI !== 'undefined' && UI.showConfirmDialog) {
                            UI.showConfirmDialog(
                                'Sign Out',
                                'Are you sure you want to sign out?',
                                async () => {
                                    if (typeof AuthService !== 'undefined') {
                                        await AuthService.logout();
                                    }
                                    localStorage.removeItem('user');
                                    if (typeof UI !== 'undefined' && UI.showToast) {
                                        UI.showToast('You have been signed out successfully.', 'success');
                                    }
                                    if (typeof LoadingOverlay !== 'undefined') {
                                        LoadingOverlay.show('Signing out...');
                                    }
                                    setTimeout(() => {
                                        window.location.replace('/');
                                    }, 800);
                                },
                                null, 'Confirm', 'Cancel', 'primary'
                            );
                        }
                    });
                }


                // Logout button confirmation
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (typeof UI !== 'undefined' && UI.showConfirmDialog) {
                            UI.showConfirmDialog(
                                'Sign Out',
                                'Are you sure you want to sign out?',
                                async () => {
                                    if (typeof AuthService !== 'undefined') {
                                        await AuthService.logout();
                                    }
                                    localStorage.removeItem('user');
                                    if (typeof UI !== 'undefined' && UI.showToast) {
                                        UI.showToast('You have been signed out successfully.', 'success');
                                    }
                                    if (typeof LoadingOverlay !== 'undefined') {
                                        LoadingOverlay.show('Signing out...');
                                    }
                                    setTimeout(() => {
                                        window.location.replace('/');
                                    }, 800);
                                },
                                null,
                                'Confirm',
                                'Cancel',
                                'primary'
                            );
                        }
                    });
                }


            } catch (error) {
                console.error('Init error:', error);
                window.location.href = UsersPageConfig.LOGIN_PAGE;
            }
        });
    </script>
    <!-- Notification System -->
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            NotificationManager.init('notif-container-users');

            // Add loading overlay transitions to all nav links
            document.querySelectorAll(
                '.dashboard__nav-link:not(.dashboard__nav-link--active), ' +
                '.dashboard__mobile-link:not(.dashboard__mobile-link--active)'
            ).forEach(link => {
                const href = link.getAttribute('href');
                if (!href || href === '#' || link.id === 'mobileLogoutBtn') return;
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const hamburger = document.getElementById('hamburgerToggle');
                    const mobileMenu = document.getElementById('mobileMenu');
                    if (hamburger) hamburger.classList.remove('dashboard__hamburger--active');
                    if (mobileMenu) mobileMenu.classList.remove('dashboard__mobile-menu--open');
                    if (typeof LoadingOverlay !== 'undefined') {
                        LoadingOverlay.navigateTo(href);
                    } else {
                        window.location.href = href;
                    }
                });
            });
        });
    </script>
