<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your ImageToTextOnline account.">
    <title>Reset Password - ImageToTextOnline</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- ========================================================================
         AUTH SECTION
         ======================================================================== -->
    <main class="auth">
        <div class="auth__container">
            <div class="auth__card">
                <!-- Header -->
                <div class="auth__header">
                    <a href="/" class="auth__logo">
                        <i class="bi bi-file-text"></i>
                        ImageToTextOnline
                    </a>
                    <h1 class="auth__title">Set New Password</h1>
                    <p class="auth__subtitle">Enter your new password below</p>
                </div>

                <!-- Invalid Token Alert (hidden by default) -->
                <div id="invalidTokenAlert" style="display: none;">
                    <div class="alert alert-danger text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Invalid or Expired Link</strong>
                        <p class="mb-2 mt-1" style="font-size: 0.9rem;">This password reset link is invalid or has
                            expired. Please request a new one.</p>
                        <a href="/auth/forgot-password" class="btn btn--primary btn--sm">
                            <i class="bi bi-arrow-clockwise me-1"></i>Request New Link
                        </a>
                    </div>
                </div>

                <!-- Reset Password Form -->
                <form id="resetPasswordForm" novalidate>
                    <!-- New Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">New Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Create a strong password" required minlength="8">
                            <button type="button" class="password-input__toggle"
                                aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <!-- Password Strength Meter -->
                        <div class="password-strength">
                            <div class="password-strength__bar">
                                <div class="password-strength__fill"></div>
                            </div>
                            <span class="password-strength__text"></span>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="Re-type your new password" required>
                            <button type="button" class="password-input__toggle"
                                aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="resetBtn" class="btn btn--primary btn--block btn--lg">
                        <i class="bi bi-shield-lock me-2"></i>
                        Reset Password
                    </button>
                </form>

                <!-- Footer -->
                <div class="auth__footer">
                    <p>Remember your password? <a href="/auth/login" class="auth__link">Sign In</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sound Manager -->
    <script src="../js/sound-manager.js"></script>

    <!-- Loading Overlay -->
    <script src="../js/loading-overlay.js"></script>

    <!-- Auth JavaScript (for password toggle + strength meter) -->
    <script src="../js/auth.js"></script>

    <!-- Custom JavaScript -->
    <script src="../js/main.js"></script>

    <!-- Update Password Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetPasswordForm');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            const invalidAlert = document.getElementById('invalidTokenAlert');

            // Extract token and email from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            // If no token or email, show invalid state
            if (!token || !email) {
                form.style.display = 'none';
                invalidAlert.style.display = 'block';
                return;
            }

            // Real-time password validation using shared Validators from auth.js
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;

                if (val === '') {
                    if (typeof UI !== 'undefined') UI.clearValidation(passwordInput);
                    // Remove strength meter content
                    const fill = document.querySelector('.password-strength__fill');
                    const text = document.querySelector('.password-strength__text');
                    if (fill) { fill.style.width = '0%'; fill.style.backgroundColor = ''; }
                    if (text) { text.textContent = ''; }
                    return;
                }

                // Use shared validator (from auth.js)
                if (typeof Validators !== 'undefined') {
                    const result = Validators.password(val);

                    // Update strength meter
                    const fill = document.querySelector('.password-strength__fill');
                    const text = document.querySelector('.password-strength__text');
                    if (fill && text) {
                        const levels = ['weak', 'fair', 'good', 'strong'];
                        const colors = ['#dc3545', '#fd7e14', '#ffc107', '#28a745'];
                        const labels = ['Weak', 'Fair', 'Good', 'Strong'];
                        const level = Math.max(0, Math.min(result.strength - 1, 3));

                        fill.style.width = `${(result.strength / 4) * 100}%`;
                        fill.style.backgroundColor = colors[level];
                        text.textContent = labels[level] || '';
                        text.style.color = colors[level];
                    }

                    // Show validation state
                    if (result.valid) {
                        passwordInput.classList.remove('is-invalid');
                        passwordInput.classList.add('is-valid');
                    } else {
                        passwordInput.classList.remove('is-valid');
                        passwordInput.classList.add('is-invalid');
                        // Show error via formGroup error element
                        const formGroup = passwordInput.closest('.form-group');
                        let errorEl = formGroup?.querySelector('.error-message');
                        if (!errorEl && formGroup) {
                            errorEl = document.createElement('div');
                            errorEl.className = 'error-message text-danger small mt-1';
                            formGroup.appendChild(errorEl);
                        }
                        if (errorEl) {
                            errorEl.textContent = result.message;
                            errorEl.style.display = 'block';
                        }
                    }

                    // Clear error when valid
                    if (result.valid) {
                        const formGroup = passwordInput.closest('.form-group');
                        const errorEl = formGroup?.querySelector('.error-message');
                        if (errorEl) errorEl.style.display = 'none';
                    }
                }

                // Re-validate confirm if filled
                if (confirmInput.value !== '') {
                    if (confirmInput.value === passwordInput.value) {
                        confirmInput.classList.remove('is-invalid');
                        confirmInput.classList.add('is-valid');
                    } else {
                        confirmInput.classList.remove('is-valid');
                        confirmInput.classList.add('is-invalid');
                    }
                }
            });

            // Confirm password validation
            confirmInput.addEventListener('input', () => {
                if (confirmInput.value === '') {
                    confirmInput.classList.remove('is-valid', 'is-invalid');
                } else if (confirmInput.value === passwordInput.value) {
                    confirmInput.classList.remove('is-invalid');
                    confirmInput.classList.add('is-valid');
                } else {
                    confirmInput.classList.remove('is-valid');
                    confirmInput.classList.add('is-invalid');
                }
            });

            // Form submit — use shared Validators for consistent checks
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = passwordInput.value;
                const confirm = confirmInput.value;

                // Validate using shared validator
                if (typeof Validators !== 'undefined') {
                    const result = Validators.password(password);
                    if (!result.valid) {
                        if (typeof UI !== 'undefined') {
                            UI.showToast(result.message, 'danger');
                        }
                        passwordInput.classList.add('is-invalid');
                        return;
                    }
                } else {
                    // Fallback: basic length check if Validators not loaded
                    if (password.length < 8) {
                        if (typeof UI !== 'undefined') {
                            UI.showToast('Password must be at least 8 characters', 'danger');
                        }
                        passwordInput.classList.add('is-invalid');
                        return;
                    }
                }

                if (password !== confirm) {
                    if (typeof UI !== 'undefined') {
                        UI.showToast('Passwords do not match', 'danger');
                    }
                    confirmInput.classList.add('is-invalid');
                    return;
                }

                // Submit
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';
                if (typeof LoadingOverlay !== 'undefined') LoadingOverlay.show('Resetting password...');

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, email, password })
                    });
                    const result = await response.json();

                    if (response.ok && result.success) {
                        // Success — show modal and redirect to login
                        if (typeof UI !== 'undefined') {
                            UI.showSuccessModal(
                                'Password Updated!',
                                'Your password has been reset successfully. You can now sign in with your new password.',
                                '/auth/login',
                                'Sign In'
                            );
                        } else {
                            alert('Password reset successful! You can now log in.');
                            window.location.href = '/auth/login';
                        }
                    } else {
                        // Error
                        if (result.error && result.error.includes('expired')) {
                            form.style.display = 'none';
                            invalidAlert.style.display = 'block';
                        } else if (typeof UI !== 'undefined') {
                            UI.showToast(result.error || 'Failed to reset password', 'danger');
                        }
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    if (typeof UI !== 'undefined') {
                        UI.showToast('Network error. Please try again.', 'danger');
                    }
                } finally {
                    if (typeof LoadingOverlay !== 'undefined') LoadingOverlay.hide();
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="bi bi-shield-lock me-2"></i>Reset Password';
                }
            });
        });
    </script>
</body>

</html>
