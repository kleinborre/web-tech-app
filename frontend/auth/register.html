<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create your free ImageToTextOnline account to access conversion history and premium features.">
    <title>Create Account - ImageToTextOnline</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- ========================================================================
         AUTH SECTION
         ======================================================================== -->
    <main class="auth">
        <div class="auth__container">
            <div class="auth__card">
                <!-- Header -->
                <div class="auth__header">
                    <a href="../index.html" class="auth__logo">
                        <i class="bi bi-file-text"></i>
                        ImageToTextOnline
                    </a>
                    <h1 class="auth__title">Create Account</h1>
                    <p class="auth__subtitle">Join us to unlock all features</p>
                </div>

                <!-- Registration Form -->
                <form id="registerForm" novalidate>
                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Enter your email address" required>
                        <span class="form-hint">We'll never share your email with anyone.</span>
                    </div>

                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Choose a username" required minlength="3" maxlength="20">
                        <span class="form-hint">3-20 characters. Letters, numbers, and either a dot or underscore (not both).</span>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Create a strong password" required minlength="8">
                            <button type="button" class="password-input__toggle"
                                aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <!-- Password Strength Meter -->
                        <div class="password-strength">
                            <div class="password-strength__bar">
                                <div class="password-strength__fill"></div>
                            </div>
                            <span class="password-strength__text"></span>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="Re-type your password" required>
                            <button type="button" class="password-input__toggle"
                                aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="form-group">
                        <div class="form-check">
                            <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
                            <label for="terms" class="form-check-label"
                                style="font-size: var(--font-size-sm); color: var(--color-gray-600);">
                                I agree to the <a href="#" class="auth__link">Terms of Service</a> and <a href="#"
                                    class="auth__link">Privacy Policy</a>
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn--primary btn--block btn--lg">
                        Create Account
                    </button>
                </form>

                <!-- Divider -->
                <div class="auth__divider">or sign up with</div>

                <!-- Social Login -->
                <button type="button" class="btn btn--google btn--block">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
                            fill="#4285F4" />
                        <path
                            d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"
                            fill="#34A853" />
                        <path
                            d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"
                            fill="#FBBC05" />
                        <path
                            d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
                            fill="#EA4335" />
                    </svg>
                    Sign up with Google
                </button>

                <!-- Footer -->
                <div class="auth__footer">
                    Already have an account?
                    <a href="login.html" class="auth__link">Sign in</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth JavaScript -->
    <script src="../js/auth.js"></script>

    <!-- Custom JavaScript -->
    <script src="../js/main.js"></script>
</body>

</html>
