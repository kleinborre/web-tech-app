<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Reset your ImageToTextOnline password. Enter your email to receive reset instructions.">
    <title>Forgot Password - ImageToTextOnline</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- ========================================================================
         AUTH SECTION
         ======================================================================== -->
    <main class="auth">
        <div class="auth__container">
            <div class="auth__card">
                <!-- Header -->
                <div class="auth__header">
                    <a href="/" class="auth__logo">
                        <i class="bi bi-file-text"></i>
                        ImageToTextOnline
                    </a>
                    <h1 class="auth__title">Reset Password</h1>
                    <p class="auth__subtitle">Enter your email to receive reset instructions</p>
                </div>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" novalidate>
                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Enter your email address" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn--primary btn--block btn--lg">
                        <i class="bi bi-envelope me-2"></i>
                        Send Reset Link
                    </button>
                </form>

                <!-- Footer -->
                <div class="auth__footer">
                    <p>Remember your password? <a href="/auth/login" class="auth__link">Sign In</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth JavaScript -->
    <script src="../js/auth.js"></script>

    <!-- Forgot Password Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotPasswordForm');
            const emailInput = document.getElementById('email');
            const submitBtn = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();

                // Validate email format
                if (!email) {
                    if (typeof UI !== 'undefined') {
                        UI.showToast('Please enter your email address', 'danger');
                    }
                    emailInput.classList.add('is-invalid');
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    if (typeof UI !== 'undefined') {
                        UI.showToast('Please enter a valid email address', 'danger');
                    }
                    emailInput.classList.add('is-invalid');
                    return;
                }

                // Send forgot-password request
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

                try {
                    const response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const result = await response.json();

                    if (response.ok && result.success) {
                        // Show success modal
                        if (typeof UI !== 'undefined') {
                            UI.showSuccessModal(
                                'Reset Link Sent!',
                                `A password reset link has been sent to <strong>${email}</strong>. Check your inbox or spam folder.`,
                                '/auth/login',
                                'OK'
                            );
                        } else {
                            alert('Password reset email sent! Check your inbox.');
                            window.location.href = '/auth/login';
                        }
                    } else {
                        // Show error
                        if (typeof UI !== 'undefined') {
                            UI.showToast(result.error || 'Failed to send reset email', 'danger');
                        }
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    // On network error, show generic success to prevent enumeration
                    if (typeof UI !== 'undefined') {
                        UI.showSuccessModal(
                            'Reset Link Sent!',
                            `If an account exists with <strong>${email}</strong>, you will receive a reset link shortly.`,
                            '/auth/login',
                            'OK'
                        );
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-envelope me-2"></i>Send Reset Link';
                }
            });

            // Live validation for email
            emailInput.addEventListener('input', () => {
                const email = emailInput.value.trim();
                if (email === '') {
                    emailInput.classList.remove('is-valid', 'is-invalid');
                } else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    emailInput.classList.remove('is-invalid');
                    emailInput.classList.add('is-valid');
                } else {
                    emailInput.classList.remove('is-valid');
                    emailInput.classList.add('is-invalid');
                }
            });
        });
    </script>
</body>

</html>
